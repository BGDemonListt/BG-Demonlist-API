logging:
  level:
    net:
      ttddyy:
        dsproxy:
          listener:
            DEBUG
    org:
      springframework:
        transaction:
          interceptor:
            TRACE

server:
  port: 8080
  frontend:
    baseUrl: ${FRONTEND_URL}
    loginUrl: ${server.frontend.baseUrl}/login
    finishRegisterUrl: ${server.frontend.baseUrl}/finish-register
    oauth2RedirectUrl: ${server.frontend.baseUrl}/process-oauth2
    discordLinkRedirectUrl: ${server.frontend.baseUrl}/process-discord-link
    forgottenPasswordUrl: ${server.frontend.baseUrl}/forgotten-password
  backend:
    baseUrl: ${BACKEND_URL}
spring:
  config:
    import: "classpath:rate-limiter.yaml"
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: jdbc:${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION}
      refresh-token:
        expiration: ${REFRESH_TOKEN_EXPIRATION}
    oauth2:
      resourceserver:
        opaquetoken:
          introspection-uri: https://www.googleapis.com
          client-id: ${GOOGLE_CLIENT_ID}
          client-secret: ${GOOGLE_CLIENT_SECRET}
    mail:
      host: smtp.gmail.com
      port: 465
      protocol: smtps
      username: ${GMAIL_USERNAME}
      password: ${GMAIL_PASSWORD}
      properties:
        mail:
          transport:
            protocol: smtps
          smtps:
            auth: true
            starttls:
              enable: true
            timeout: 8000
application:
  security:
    cookies:
      secure: ${AUTH_COOKIE_SECURE:false}
      http-only: true
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
      domain: ${AUTH_COOKIE_DOMAIN:}
      access-token:
        name: BGDL_ACCESS_TOKEN
        path: /
      refresh-token:
        name: BGDL_REFRESH_TOKEN
        path: /api/v1/auth
  oauth2:
    discord:
      clientId: ${DISCORD_CLIENT_ID}
      clientSecret: ${DISCORD_CLIENT_SECRET}
      authorizationUri: https://discord.com/oauth2/authorize
      tokenUri: https://discord.com/api/oauth2/token
      apiBaseUri: https://discord.com/api/v10
      userInfoPath: /users/@me
      stateTtl: 10m
  upload:
    directory: server/src/main/resources/static/uploads/
