resilience4j:
  rate-limiter:
    instances:
      general_api_rate_limiter:
        limitForPeriod: 3000
        limitRefreshPeriod: 1m
        timeoutDuration: 0    # no timeout
      sensitive_operations_rate_limiter:
        limitForPeriod: 100
        limitRefreshPeriod: 1m
        timeoutDuration: 0
      moderation_rate_limiter:
        limitForPeriod: 600
        limitRefreshPeriod: 1m
        timeoutDuration: 0
